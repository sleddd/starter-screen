<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root{
    --fg:#fff;
    --shadow:0 2px 20px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    font-weight:400;
    color:var(--fg);
    background:#1a1a1a;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed; inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.2s ease;
    z-index:0;
  }
  .bg.on{opacity:1}
  .scrim{
    position:fixed; inset:0; z-index:1;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.46) 0%, rgba(0,0,0,.10) 24%,
                                  rgba(0,0,0,.10) 66%, rgba(0,0,0,.52) 100%);
    pointer-events:none;
  }

  .wrap{position:relative; z-index:2; height:100%; display:flex; flex-direction:column}

  /* ---------- top bar ---------- */
  .top{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:26px 34px 0; gap:24px;
  }
  .tools{display:flex; gap:14px; flex-shrink:0; align-items:flex-start}
  .tool{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-size:13px; letter-spacing:.2px; opacity:.9;
    text-shadow:var(--shadow); cursor:pointer;
    background:none;border:none;color:inherit;font-family:inherit;
    transition:opacity .18s;
  }
  .tool:hover{opacity:.65}
  .tool svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}

  /* critter on/off switch — vertical wall-switch plate */
  .critter-toggle svg .plate{
    fill:none; stroke:currentColor;
  }
  .critter-toggle svg .rocker{
    fill:currentColor; stroke:none;
    /* translate, not y — Safari doesn't animate SVG geometry properties */
    transition:transform .18s cubic-bezier(.3,1.5,.5,1);
  }
  /* off: rocker drops to the bottom of the plate */
  .critter-toggle[aria-pressed="false"] svg .rocker{transform:translateY(6px)}
  .critter-toggle[aria-pressed="false"]{opacity:.5}

  .clocks{
    display:flex; align-items:flex-start; gap:30px;
    flex-wrap:wrap; justify-content:flex-end;
  }
  .clock{display:flex; flex-direction:column; align-items:center; gap:2px}
  .clock .t{
    display:flex; align-items:baseline; gap:0;
    font-size:25px; font-weight:400; letter-spacing:-.4px;
    text-shadow:var(--shadow); white-space:nowrap;
  }
  .clock .t svg{margin-right:7px; align-self:center}
  .clock .t svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
                stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .clock .c{font-size:13px; opacity:.9; text-shadow:var(--shadow); white-space:nowrap}
  .clock .t .ampm{font-size:.62em; font-weight:400; margin-left:4px}

  /* ---------- center clock ---------- */
  .mid{flex:1; display:flex; align-items:center; justify-content:center; padding-bottom:40px}
  .big{
    font-size:clamp(90px,13.5vw,190px);
    font-weight:600; letter-spacing:-4px; line-height:1;
    text-shadow:0 4px 44px rgba(0,0,0,.4);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- bottom ---------- */
  .bottom{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:end; gap:24px;
    padding:0 34px 30px;
  }
  .place{
    display:flex; align-items:center; gap:11px;
    font-size:13.5px; opacity:.9; text-shadow:var(--shadow);
    justify-self:start; min-width:0;
  }
  .place svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
             stroke-linecap:round;flex-shrink:0}
  .place button{
    background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    opacity:.9;transition:opacity .18s;padding:0;
  }
  .place button:hover{opacity:1;text-decoration:underline}

  .fav{
    display:inline-flex; align-items:center; padding:0;
    background:none; border:none; cursor:pointer;
    opacity:.9; transition:opacity .18s, transform .18s;
  }
  .fav:hover{opacity:1; transform:scale(1.15)}
  .fav svg{
    width:16px; height:16px;
    fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linejoin:round; transition:fill .18s;
  }
  .fav.on{opacity:1}
  .fav.on svg{fill:#ff5a72; stroke:#ff5a72}

  /* ---------- settings popup ---------- */
  .place{position:relative}
  .gear{
    display:inline-flex; align-items:center; padding:0;
    background:none; border:none; cursor:pointer; color:inherit;
    opacity:.9; transition:opacity .18s;
  }
  .gear:hover{opacity:1}
  .gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
            stroke-linecap:round}
  .menu{
    position:absolute; bottom:calc(100% + 14px); left:0;
    min-width:390px; max-width:440px;
    background:rgba(22,22,24,.86);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    z-index:30; text-align:left;
  }
  .menu[hidden]{display:none}
  .menu-item{
    display:flex; align-items:center; gap:11px; width:100%;
    padding:14px 12px; border:none; border-radius:9px;
    background:none; color:#fff; font:inherit; font-size:14.5px;
    text-align:left; cursor:pointer; opacity:.9;
  }
  .menu-item:hover{background:rgba(255,255,255,.12); opacity:1}
  .menu-item svg{width:17px;height:17px;stroke:currentColor;fill:none;
                 stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .menu-sep{height:1px;background:rgba(255,255,255,.13);margin:12px 4px}
  .menu-head{
    font-size:11px; text-transform:uppercase; letter-spacing:.7px;
    opacity:.9; padding:4px 12px 12px;
  }
  .menu-list{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
    max-height:330px; overflow-y:auto; padding:2px 12px 8px;
  }
  .menu-empty{
    grid-column:1 / -1;
    font-size:13px; opacity:.9; padding:5px 0 10px;
  }
  .menu-fav{
    display:flex; align-items:center; justify-content:center;
    padding:0; border:none; cursor:pointer;
    border-radius:6px; overflow:hidden;
    aspect-ratio:4 / 3; width:100%;
    background:rgba(255,255,255,.07);
    outline:1px solid rgba(255,255,255,.18); outline-offset:-1px;
    transition:transform .15s, outline-color .15s;
  }
  .menu-fav img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }
  .menu-fav:hover{transform:scale(1.06); outline-color:rgba(255,255,255,.75)}
  .quote{
    font-size:16.5px; font-style:italic; text-align:center;
    max-width:600px; line-height:1.45;
    justify-self:center;
    text-shadow:0 1px 3px rgba(0,0,0,.55), 0 2px 18px rgba(0,0,0,.45);
  }
  .quote .who{
    font-style:normal; opacity:.9; font-size:13.5px;
    display:block; margin-top:5px;
  }
  .skipquote{
    display:block; margin:6px auto 0;
    background:none; border:none; padding:0;
    color:inherit; font:inherit;
    font-style:italic; font-size:12px;
    cursor:pointer; opacity:.55; transition:opacity .18s;
    text-shadow:var(--shadow); white-space:nowrap;
  }
  .skipquote:hover{opacity:1; text-decoration:underline}
  .spacer{justify-self:end}
  .credit{
    font-size:11.5px; opacity:.9; text-shadow:var(--shadow);
    text-align:right; white-space:nowrap; visibility:hidden;
  }
  .credit a{color:inherit; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.32)}
  .credit a:hover{opacity:1}

  /* ---------- search overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:20;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:none; align-items:center; justify-content:center;
  }
  .overlay.on{display:flex}
  .overlay input{
    width:min(640px,80vw); padding:17px 24px;
    font-size:21px; font-family:inherit;
    color:#fff; background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.28); border-radius:13px;
    outline:none;
  }
  .overlay input::placeholder{color:rgba(255,255,255,.55)}
  .hint{
    position:absolute; bottom:34%; font-size:13px; opacity:.6;
    text-shadow:var(--shadow);
  }

  /* ---------- octavian ---------- */
  .octavian{
    position:fixed; right:6px; bottom:0; z-index:3;
    width:clamp(120px,13vw,196px);
    pointer-events:none;
    transform:translateY(110%);
    animation:oct-enter 1.5s cubic-bezier(.22,1.1,.36,1) 1.1s forwards;
  }
  .octavian img{
    display:block; width:100%; height:auto;
    /* lift him off the photo so he doesn't read as a sticker */
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
    transform-origin:60% 100%;
    animation:oct-float 7s ease-in-out infinite;
  }
  /* entrance: peek up from below the corner */
  @keyframes oct-enter{
    from{transform:translateY(110%)}
    to  {transform:translateY(25%)}
  }
  /* idle: a slow breathing bob with a touch of sway */
  @keyframes oct-float{
    0%,100%{transform:translateY(0)    rotate(0deg)   scaleY(1)}
    28%    {transform:translateY(-5px) rotate(-1.1deg) scaleY(1.012)}
    52%    {transform:translateY(-2px) rotate(.5deg)  scaleY(.994)}
    76%    {transform:translateY(-6px) rotate(1deg)   scaleY(1.008)}
  }

  /* steam off the mug he's pouring */
  .octavian .steam{
    /* anchored on the mug rim; zero-height so wisps rise freely from that point */
    position:absolute; left:29%; bottom:30%;
    width:24%; height:0;
    pointer-events:none; overflow:visible; z-index:2;
  }
  .octavian .steam i{
    position:absolute; bottom:0;
    width:26px; height:30px;
    /* soft vapor puff rather than a hard dot */
    background:radial-gradient(ellipse at 50% 60%,
      rgba(255,255,255,.95) 0%, rgba(255,255,255,.6) 38%, rgba(255,255,255,0) 72%);
    filter:blur(3px);
    opacity:0;
    animation:oct-steam 5s ease-out infinite;
    will-change:transform,opacity;
  }
  /* staggered so the plume never pulses in lockstep */
  .octavian .steam i:nth-child(1){left:8%;  animation-delay:0s;    animation-duration:5.2s}
  .octavian .steam i:nth-child(2){left:34%; animation-delay:.9s;   animation-duration:4.4s}
  .octavian .steam i:nth-child(3){left:58%; animation-delay:1.9s;  animation-duration:5.8s}
  .octavian .steam i:nth-child(4){left:20%; animation-delay:2.7s;  animation-duration:4.8s; width:7px}
  .octavian .steam i:nth-child(5){left:46%; animation-delay:3.6s;  animation-duration:5.4s; width:11px}
  /* rises while curling side to side, thinning as it goes */
  @keyframes oct-steam{
    0%  {opacity:0;   transform:translate(0,0)        scale(.4)  rotate(0deg)}
    12% {opacity:.9}
    35% {opacity:.75; transform:translate(-9px,-30px)  scale(.85) rotate(-6deg)}
    60% {opacity:.5;  transform:translate(7px,-56px)   scale(1.2) rotate(5deg)}
    85% {opacity:.2;  transform:translate(-6px,-80px)  scale(1.6) rotate(-4deg)}
    100%{opacity:0;   transform:translate(3px,-100px)  scale(2)   rotate(3deg)}
  }

  /* he perks up when you come near */
  .octavian.awake{animation-play-state:paused; transform:translateY(16%)}
  .octavian.awake img{animation-duration:2.4s; transform:rotate(-3deg) scale(1.04)}
  .octavian, .octavian img{transition:transform .55s cubic-bezier(.22,1,.36,1)}
  .octavian .hit{
    position:absolute; inset:0; pointer-events:auto; cursor:pointer;
  }
  /* startled little hop when clicked */
  .octavian.hop img{animation:oct-hop .7s cubic-bezier(.3,1.4,.5,1)}
  @keyframes oct-hop{
    0%  {transform:translateY(0) rotate(0)}
    30% {transform:translateY(-16px) rotate(-6deg) scale(1.05)}
    60% {transform:translateY(-4px) rotate(3deg)}
    100%{transform:translateY(0) rotate(0)}
  }

  /* ---------- gerald ---------- */
  .gerald{
    position:fixed; left:2px; bottom:0; z-index:3;
    width:clamp(78px,7vw,112px);
    pointer-events:none;
    transform:translateY(110%);
    animation:ger-enter 1.4s cubic-bezier(.22,1.1,.36,1) 1.5s forwards;
  }
  /* walk layer: carries him back and forth across the corner */
  .gerald .walk{
    display:block;
    animation:ger-pace 19s ease-in-out infinite;
  }
  /* flip layer: he's drawn facing right, so scaleX(-1) is the return leg */
  .gerald .turn{
    display:block;
    animation:ger-turn 19s steps(1,end) infinite;
  }
  /* strut layer: the bob + waddle of walking */
  .gerald .strut{
    display:block;
    transform-origin:50% 100%;
    animation:ger-strut .62s ease-in-out infinite;
  }
  .gerald img{
    display:block; width:100%; height:auto;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
    transform-origin:50% 80%;
    /* grumbling head-shake, runs continuously while he walks */
    animation:ger-shake 1.24s ease-in-out infinite;
  }
  /* slower than the strut so the two drift in and out of phase
     instead of locking into one mechanical beat */
  @keyframes ger-shake{
    0%,100%{transform:rotate(0deg)}
    20%    {transform:rotate(-3.4deg)}
    45%    {transform:rotate(2.6deg)}
    70%    {transform:rotate(-1.8deg)}
  }
  @keyframes ger-enter{
    from{transform:translateY(110%)}
    to  {transform:translateY(16%)}
  }
  /* the route: amble right, pause and consider, amble back, pause */
  @keyframes ger-pace{
    0%,  6%  {transform:translateX(0)}
    38%, 52% {transform:translateX(128px)}
    84%, 100%{transform:translateX(0)}
  }
  /* natural art faces right: unflipped outbound, mirrored on the way back.
     Flips happen during the stationary pauses, not mid-stride. */
  @keyframes ger-turn{
    0%   {transform:scaleX(1)}
    45%  {transform:scaleX(-1)}
    91%  {transform:scaleX(1)}
    100% {transform:scaleX(1)}
  }
  /* head-bob + waddle, paced to footfalls while he's moving */
  @keyframes ger-strut{
    0%,100%{transform:translateY(0)    rotate(0deg)}
    25%    {transform:translateY(-3px) rotate(-2.2deg)}
    50%    {transform:translateY(0)    rotate(0deg)}
    75%    {transform:translateY(-3px) rotate(2.2deg)}
  }
  /* standing still at each end of the route — strut and grumbling both stop */
  .gerald.resting .strut{animation:ger-idle 4.6s ease-in-out infinite}
  .gerald.resting img{animation:none}
  @keyframes ger-idle{
    0%,100%{transform:translateY(0)      rotate(0deg)}
    50%    {transform:translateY(-1.5px) rotate(0deg)}
  }
  /* he stops pacing and glares at you */
  .gerald.awake{transform:translateY(8%)}
  .gerald.awake .walk,
  .gerald.awake .turn,
  .gerald.awake .strut,
  .gerald.awake img{animation-play-state:paused}
  .gerald{transition:transform .5s cubic-bezier(.22,1,.36,1)}
  /* hit box kept off the heart button so favoriting still works */
  /* Only his head/chest is clickable. The controls row sits ~73px below the
     top of his box, so the hit area stops well short of it — a percentage
     here would drift, since his box extends past the bottom of the screen. */
  .gerald .hit{
    position:absolute; left:0; right:0; top:0; height:58px;
    pointer-events:auto; cursor:pointer;
  }
  /* startled hop when clicked — distinct from the constant head-shake */
  .gerald.cluck .strut{animation:ger-cluck .6s cubic-bezier(.3,1.5,.5,1) !important}
  @keyframes ger-cluck{
    0%,100%{transform:translateY(0)    scale(1,1)}
    18%    {transform:translateY(-14px) scale(.94,1.08)}
    45%    {transform:translateY(-3px)  scale(1.05,.95)}
    70%    {transform:translateY(-6px)  scale(1,1)}
  }

  @media (prefers-reduced-motion:reduce){
    .octavian{animation:none; transform:translateY(25%)}
    .octavian img{animation:none}
    .octavian .steam{display:none}
    .gerald{animation:none; transform:translateY(16%)}
    .gerald .walk,.gerald .turn,.gerald .strut,.gerald img{animation:none}
  }
  /* hidden: they duck back down off the bottom edge rather than vanishing */
  body.no-critters .octavian,
  body.no-critters .gerald{
    animation:none;
    transform:translateY(115%);
    pointer-events:none;
  }
  body.no-critters .octavian{transition:transform .55s cubic-bezier(.5,0,.75,0)}
  body.no-critters .gerald{transition:transform .5s cubic-bezier(.5,0,.75,0) .08s}

  @media (max-width:1100px){ .octavian,.gerald{display:none} }

  @media (max-width:1100px){
    .top{flex-direction:column; align-items:center; gap:20px}
    .clocks{justify-content:center; gap:22px}
    .clock .t{font-size:21px}
    .bottom{grid-template-columns:1fr; gap:16px; text-align:center}
    .place,.quote{justify-self:center}
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="scrim"></div>

<div class="wrap">

  <header class="top">
    <div class="tools">
      <button class="tool" id="searchBtn" title="Search (press /)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>

      <button class="tool critter-toggle" id="critterBtn" title="Show critters" aria-pressed="true">
        <svg viewBox="0 0 24 24">
          <!-- wall switch plate: outer plate + rocker that flips up (on) / down (off) -->
          <rect class="plate" x="6.5" y="2.5" width="11" height="19" rx="2"/>
          <rect class="rocker" x="9.5" y="5.5" width="5" height="7" rx="1.2"/>
        </svg>
      </button>
    </div>

    <div class="clocks" id="clocks"></div>
  </header>

  <main class="mid"><div class="big" id="big">--:--</div></main>

  <footer class="bottom">
    <div class="place">
      <button id="settingsBtn" class="gear" title="Photo options" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.4"/><path d="M3 8h1.6M9.4 8H21"/><circle cx="16" cy="16" r="2.4"/><path d="M3 16h10.6M18.4 16H21"/></svg>
      </button>

      <div class="menu" id="settingsMenu" hidden>
        <button class="menu-item" id="nextPhoto">
          <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
          <span><em>Skip to next photo</em></span>
        </button>
        <div class="menu-sep"></div>
        <div class="menu-head">Favorites</div>
        <div class="menu-list" id="favMenuList"></div>
      </div>

      <button id="placeName" title="Click to rename this photo's location">&nbsp;</button>
      <button id="favBtn" class="fav" title="Save this photo to favorites" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 20.4l-1.6-1.5C5.5 14.5 2.6 11.9 2.6 8.6 2.6 6 4.7 4 7.3 4c1.5 0 2.9.7 3.8 1.8h1.8C13.8 4.7 15.2 4 16.7 4c2.6 0 4.7 2 4.7 4.6 0 3.3-2.9 5.9-7.8 10.3z"/></svg>
      </button>
    </div>
    <div class="quote" id="quote"></div>
    <div class="spacer"><div class="credit" id="credit"></div></div>
  </footer>

</div>

<div class="gerald" id="gerald">
  <div class="walk"><div class="turn"><div class="strut">
    <img src="gerald.png" alt="Gerald, a distinctly unimpressed chicken">
  </div></div></div>
  <div class="hit" title="Gerald"></div>
</div>

<div class="octavian" id="octavian">
  <img src="octavian.png" alt="Octavian, an octopus pouring coffee">
  <div class="steam"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hit" title="Octavian"></div>
</div>

<div class="overlay" id="overlay">
  <input id="q" type="text" placeholder="Search the web…" autocomplete="off" spellcheck="false">
  <div class="hint">Enter to search · Esc to close</div>
</div>

<script src="fetch-photos.js"></script>

<script>
(function(){
  "use strict";

  var ZONES = [
    {city:"Hawaii",       tz:"Pacific/Honolulu"},
    {city:"Portland",     tz:"America/Los_Angeles"},
    {city:"New Orleans",  tz:"America/Chicago"},
    {city:"New York",     tz:"America/New_York"},
    {city:"London",       tz:"Europe/London"},
    {city:"France",       tz:"Europe/Paris"},
    {city:"Cape Town",    tz:"Africa/Johannesburg"}
  ];

  var WEATHER = [
    {city:"Portland",    lat:45.52, lon:-122.68},
    {city:"New Orleans", lat:29.95, lon:-90.07}
  ];

  var HOME_TZ = "America/Los_Angeles";

  var $ = function(id){ return document.getElementById(id); };

  var memStore = {};
  function store(k, v){
    var key = "sp_" + k;
    if(v === undefined){
      if(Object.prototype.hasOwnProperty.call(memStore, key)) return memStore[key];
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    }
    memStore[key] = String(v);
    try{ localStorage.setItem(key, v); }catch(e){}
  }

  function timeIn(tz){
    var parts = new Intl.DateTimeFormat("en-US",{
      timeZone:tz, hour:"numeric", minute:"2-digit", hour12:true
    }).formatToParts(new Date());
    var h="", m="", ap="";
    for(var i=0;i<parts.length;i++){
      if(parts[i].type==="hour") h=parts[i].value;
      else if(parts[i].type==="minute") m=parts[i].value;
      else if(parts[i].type==="dayPeriod") ap=parts[i].value;
    }
    return {hm:h+":"+m, ap:(ap||"").toLowerCase()};
  }

  var clockSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>';

  function buildClocks(){
    var html = "";
    for(var i=0;i<ZONES.length;i++){
      html += '<div class="clock" data-tz="'+ZONES[i].tz+'">'
            +   '<div class="t">'+clockSvg+'<span class="v">--:--</span><span class="ampm"></span></div>'
            +   '<div class="c">'+ZONES[i].city+'</div>'
            + '</div>';
    }
    for(var j=0;j<WEATHER.length;j++){
      html += '<div class="clock" data-wx="'+j+'">'
            +   '<div class="t">'
            +     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>'
            +     '<span class="v">--</span>'
            +   '</div>'
            +   '<div class="c">'+WEATHER[j].city+'</div>'
            + '</div>';
    }
    $("clocks").innerHTML = html;
  }

  function tick(){
    var nodes = document.querySelectorAll(".clock[data-tz]");
    for(var i=0;i<nodes.length;i++){
      var t = timeIn(nodes[i].getAttribute("data-tz"));
      nodes[i].querySelector(".v").textContent = t.hm;
      nodes[i].querySelector(".ampm").textContent = t.ap;
    }
    $("big").textContent = timeIn(HOME_TZ).hm;
  }

  function loadWeather(){
    for(var i=0;i<WEATHER.length;i++){
      (function(idx){
        var w = WEATHER[idx];
        var url = "https://api.open-meteo.com/v1/forecast?latitude="+w.lat
                + "&longitude="+w.lon+"&current=temperature_2m&temperature_unit=fahrenheit";
        fetch(url)
          .then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .then(function(d){
            var el = document.querySelector('.clock[data-wx="'+idx+'"] .v');
            if(el && d && d.current && typeof d.current.temperature_2m === "number"){
              el.textContent = Math.round(d.current.temperature_2m) + "°";
            }
          })
          .catch(function(){
            var node = document.querySelector('.clock[data-wx="'+idx+'"]');
            if(node) node.style.display = "none";
          });
      })(i);
    }
  }

  var current = null;

  // The photo of the day is pinned to the local calendar date: reopening a tab
  // reuses it, and only "Skip to next photo" (or a new day) picks a new one.
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }

  function cachedPhoto(){
    var raw = store("photo_of_day");
    if(!raw) return null;
    try{
      var saved = JSON.parse(raw);
      if(saved && saved.day === todayKey() && saved.photo && saved.photo.url) return saved.photo;
    }catch(e){}
    return null;
  }

  function cachePhoto(photo){
    if(!photo || !photo.url) return;
    try{ store("photo_of_day", JSON.stringify({day: todayKey(), photo: photo})); }catch(e){}
  }

  function labelFor(photo){
    var custom = store("name_" + (photo.url || photo.id));
    return custom || photo.label;
  }

  function showPhoto(photo){
    current = photo;
    var img = new Image();
    img.onload = function(){
      var bg = $("bg");
      bg.style.backgroundImage = 'url("' + photo.url + '")';
      bg.classList.add("on");
      $("placeName").textContent = labelFor(photo);
      renderCredit(photo);
      renderFav();
    };
    img.onerror = function(){
      $("placeName").textContent = "";
      renderCredit(null);
    };
    img.src = photo.url;
  }

  // force = true skips the cache (the shuffle button) and pins the new photo
  // as today's.
  function loadPhoto(force, tries){
    tries = tries || 0;
    if(!force){
      var saved = cachedPhoto();
      if(saved){ showPhoto(saved); return; }
    }
    getRandomPhoto()
      .then(function(photo){
        cachePhoto(photo);
        showPhoto(photo);
      })
      .catch(function(err){
        var msg = (err && err.message) || "";
        var hopeless = msg.indexOf("rate limit") !== -1 ||
                       msg.indexOf("access key") !== -1;
        if(!hopeless && tries < 1){ loadPhoto(true, tries + 1); return; }
        $("placeName").textContent = "";
        renderCredit(null);
        if(window.console) console.warn("Background unavailable:", msg);
      });
  }

  function renderCredit(photo){
    var el = $("credit");
    if(!el) return;
    if(photo && photo.by){
      el.innerHTML = photo.link
        ? 'Photo by <a href="'+photo.link+'" target="_blank" rel="noopener">'+photo.by+'</a> on Unsplash'
        : 'Photo by ' + photo.by + ' on Unsplash';
      el.style.visibility = "visible";
    } else {
      el.innerHTML = "";
      el.style.visibility = "hidden";
    }
  }

    var text = cut === -1 ? raw : raw.slice(0, cut);
    var who  = cut === -1 ? ""  : raw.slice(cut + 3);

    var el = $("quote");
    el.innerHTML = "";

    var textSpan = document.createElement("span");
    textSpan.textContent = "“" + text.trim() + "”";
    el.appendChild(textSpan);

    if(who.trim()){
      var line = document.createElement("span");
      line.className = "who";
      line.textContent = who.trim();
      el.appendChild(line);
    }

    var skip = document.createElement("button");
    skip.className = "skipquote";
    skip.type = "button";
    skip.title = "Show another quote";
    skip.textContent = "next quote";
    skip.addEventListener("click", nextQuote);
    el.appendChild(skip);
  }

  function favList(){
    try{ return JSON.parse(store("favs") || "null") || FAVORITES.slice(); }
    catch(e){ return FAVORITES.slice(); }
  }
  function favSave(list){
    store("favs", JSON.stringify(list));
    renderFav();
    if(!$("settingsMenu").hidden) renderFavMenu();
  }
  function isFav(photo){
    if(!photo) return false;
    var l = favList();
    for(var i=0;i<l.length;i++) if(l[i].url === photo.url) return true;
    return false;
  }
  function toggleFav(){
    if(!current) return;
    var l = favList(), out = [], found = false;
    for(var i=0;i<l.length;i++){
      if(l[i].url === current.url){ found = true; }
      else { out.push(l[i]); }
    }
    if(!found){
      out.push({
        url:   current.url,
        thumb: current.thumb || "",
        place: labelFor(current),
        by:    current.by || "",
        link:  current.link || "",
        saved: new Date().toISOString().slice(0,10)
      });
    }
    favSave(out);
  }
  function renderFav(){
    var btn = $("favBtn");
    if(!btn) return;
    var on = isFav(current);
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.title = on ? "Remove from favorites" : "Save this photo to favorites";
  }
  function initFav(){
    $("favBtn").addEventListener("click", toggleFav);
    renderFav();
  }

  function thumbUrl(fav){
    if(fav.thumb) return fav.thumb;
    return String(fav.url || "")
      .replace(/([?&])fit=crop/, "$1fit=max")
      .replace(/([?&])crop=[^&]*/, "$1")
      .replace(/([?&])h=\d+/, "$1")
      .replace(/([?&])w=\d+/, "$1w=400")
      .replace(/([?&])q=\d+/, "$1q=60")
      .replace(/\?&/, "?");
  }

  function menuOpen(){ return !$("settingsMenu").hidden; }
  function closeMenu(){
    $("settingsMenu").hidden = true;
    $("settingsBtn").setAttribute("aria-expanded","false");
  }
  function openMenu(){
    renderFavMenu();
    $("settingsMenu").hidden = false;
    $("settingsBtn").setAttribute("aria-expanded","true");
  }

  function renderFavMenu(){
    var box = $("favMenuList");
    var l = favList();
    if(!l.length){
      box.innerHTML = '<div class="menu-empty">No favorites yet — tap the heart.</div>';
      return;
    }
    box.innerHTML = "";
    l.forEach(function(f){
      var b = document.createElement("button");
      b.className = "menu-fav";
      b.title = f.place || "Saved photo";
      var im = document.createElement("img");
      im.src = thumbUrl(f);
      im.alt = f.place || "";
      im.loading = "lazy";
      b.appendChild(im);
      b.addEventListener("click", function(){
        var photo = {url:f.url, thumb:f.thumb, label:f.place, by:f.by, link:f.link};
        cachePhoto(photo);   // a chosen favorite becomes today's photo too
        showPhoto(photo);
        closeMenu();
      });
      box.appendChild(b);
    });
  }

  function initSettings(){
    $("settingsBtn").addEventListener("click", function(e){
      e.stopPropagation();
      menuOpen() ? closeMenu() : openMenu();
    });
    $("nextPhoto").addEventListener("click", function(){
      loadPhoto(true);
      closeMenu();
    });
    document.addEventListener("click", function(e){
      if(!menuOpen()) return;
      if(!$("settingsMenu").contains(e.target) && e.target !== $("settingsBtn")) closeMenu();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && menuOpen()) closeMenu();
    });
  }

  function initSearch(){
    var ov = $("overlay"), q = $("q");
    function open(){ ov.classList.add("on"); q.value=""; q.focus(); }
    function close(){ ov.classList.remove("on"); }
    $("searchBtn").addEventListener("click", open);
    document.addEventListener("keydown", function(e){
      if(e.key === "/" && !ov.classList.contains("on")){
        var tag = (document.activeElement||{}).tagName;
        if(tag !== "INPUT"){ e.preventDefault(); open(); }
      } else if(e.key === "Escape"){ close(); }
    });
    q.addEventListener("keydown", function(e){
      if(e.key === "Enter" && q.value.trim()){
        location.href = "https://www.google.com/search?q=" + encodeURIComponent(q.value.trim());
      }
    });
    ov.addEventListener("click", function(e){ if(e.target === ov) close(); });
  }

  function initRename(){
    $("placeName").addEventListener("click", function(){
      if(!current) return;
      var val = window.prompt(
        "What is this place? (saved for this photo)",
        labelFor(current)
      );
      if(val !== null && val.trim()){
        store("name_" + (current.url || current.id), val.trim());
        $("placeName").textContent = val.trim();
        var l = favList(), changed = false;
        for(var i=0;i<l.length;i++){
          if(l[i].url === current.url){ l[i].place = val.trim(); changed = true; }
        }
        if(changed) favSave(l);
      }
    });
  }

  /* Swap Gerald's strut for a still idle during the pauses in his route,
     so he isn't marching in place at the ends. Mirrors ger-pace's timing. */
  function initGeraldPacing(){
    var el = document.getElementById("gerald");
    if(!el) return;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;

    var CYCLE = 19000;
    // performance.now() is relative to page load, the same origin the CSS
    // animations use — Date.now() (unix epoch) would drift against them.
    // .walk has no delay of its own, so its cycle began at page load
    var t0 = 0;

    // ger-pace holds position at 0-6%, travels to 38%, holds to 52%,
    // returns by 84%, then holds. He's only moving in those two travel spans.
    function update(){
      var t = (performance.now() - t0) % CYCLE;
      var p = t / CYCLE;
      var moving = (p >= .06 && p < .38) || (p >= .52 && p < .84);
      el.classList.toggle("resting", !moving);
    }
    update();
    setInterval(update, 120);
  }

  /* ---------- critter on/off switch ---------- */
  function initCritterToggle(){
    var btn = $("critterBtn");
    if(!btn) return;

    // default on; only an explicit "0" hides them
    var on = store("critters") !== "0";

    function apply(){
      document.body.classList.toggle("no-critters", !on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.title = on ? "Hide Gerald & Octavian" : "Show Gerald & Octavian";
    }

    // set initial state without the ducking transition firing on load
    document.body.classList.toggle("no-critters", !on);
    apply();

    btn.addEventListener("click", function(){
      on = !on;
      store("critters", on ? "1" : "0");
      apply();
    });
  }

  /* ---------- critters ---------- */
  function initCritter(id, reactClass, reactMs){
    var el = document.getElementById(id);
    if(!el) return;
    var hit = el.querySelector(".hit");
    if(!hit) return;

    hit.addEventListener("mouseenter", function(){ el.classList.add("awake"); });
    hit.addEventListener("mouseleave", function(){ el.classList.remove("awake"); });

    hit.addEventListener("click", function(){
      if(el.classList.contains(reactClass)) return;
      el.classList.add(reactClass);
      setTimeout(function(){ el.classList.remove(reactClass); }, reactMs);
    });
  }

  buildClocks();
  tick();
  setInterval(tick, 1000);
  loadWeather();
  setInterval(loadWeather, 15*60*1000);
  loadPhoto();
  setQuote();
  initSearch();
  initRename();
  initFav();
  initSettings();
  initCritterToggle();
  initCritter("octavian", "hop", 700);
  initCritter("gerald", "cluck", 600);
  initGeraldPacing();
})();
</script>
</body>
</html>
